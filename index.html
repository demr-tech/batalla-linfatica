<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Batalla linfática · Arena de patología</title>
<link rel="stylesheet" href="/fiesta.css"><style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{color-scheme:dark;font-family:'Space Grotesk',system-ui,sans-serif;background:#101326;color:#f5f4ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0,#43307070,transparent 50%),radial-gradient(ellipse at 0 80%,#086e6a35,transparent 50%);min-height:100vh}main{max-width:1100px;margin:auto;padding:30px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:55px}.brand{font-weight:700;font-size:19px}.brand b{color:#b6f76e}.pill,.tag{border:1px solid #ffffff25;border-radius:30px;padding:8px 13px;font-size:12px;color:#c1c3d7}.eyebrow{color:#b6f76e;letter-spacing:3px;font-size:12px;text-transform:uppercase}h1{font-size:clamp(45px,7vw,82px);line-height:1.03;letter-spacing:-4px;margin:18px 0}h1 span{color:#b6f76e}h2{font-size:clamp(24px,4vw,36px);line-height:1.25;letter-spacing:-1px}p{color:#b9bad1;line-height:1.7}.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:50px;align-items:center}.card{background:#1c2038d9;border:1px solid #ffffff18;border-radius:26px;padding:28px;box-shadow:0 22px 60px #0002}.tabs{display:flex;background:#111429;border-radius:13px;padding:5px;gap:5px}.tabs button{flex:1;background:none;color:#c1c3d7;padding:12px}.tabs .active{background:#363c59;color:white}button{border:0;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;transition:transform .15s}button:hover{transform:translateY(-2px)}button:disabled{cursor:default;opacity:.65;transform:none}input,select{width:100%;padding:16px;margin:9px 0 19px;background:#111429;border:1px solid #444860;border-radius:12px;color:white;font:inherit}label{font-size:13px;color:#c9c9da}.primary{background:#b6f76e;color:#15211b;padding:17px 24px;width:100%}.secondary{background:#383e60;color:white;padding:13px 20px}.features{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}.features span{font-size:12px;padding:10px;background:#ffffff07;border-radius:8px}.orb{width:62px;height:62px;border-radius:20px;background:#b6f76e;color:#15211b;display:grid;place-items:center;font-size:31px;transform:rotate(-10deg);margin-bottom:24px}.code{font-size:clamp(40px,8vw,76px);letter-spacing:10px;color:#b6f76e;font-weight:bold;margin:14px 0}.center{text-align:center}.players{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:25px 0}.player{background:#303651;padding:12px 18px;border-radius:30px}.status{display:flex;justify-content:space-between;align-items:center;gap:10px}.bar{height:7px;background:#343850;border-radius:8px;margin:22px 0;overflow:hidden}.bar div{height:100%;background:#b6f76e;transition:width .3s}.options{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:27px 0}.option{min-height:90px;text-align:left;background:#282f4e;color:white;padding:20px;border:2px solid #ffffff12;font-size:16px;display:flex;gap:13px;align-items:center}.option i{font-style:normal;background:#ffffff17;border-radius:8px;min-width:30px;height:30px;display:grid;place-items:center}.option:nth-child(2){background:#382c50}.option:nth-child(3){background:#194847}.option:nth-child(4){background:#4a353b}.option.chosen{border-color:#d4bdff}.option.correct{background:#244c36;border-color:#b6f76e}.option.wrong{border-color:#ff7f99}.explain{background:#b6f76e12;border-left:3px solid #b6f76e;padding:18px;border-radius:5px;line-height:1.6}.rank{display:flex;align-items:center;justify-content:space-between;padding:16px;margin:8px 0;background:#ffffff07;border-radius:12px}.rank:first-child{border:1px solid #b6f76e77}.error{color:#ffa0b4;min-height:24px;font-size:14px}.small{font-size:12px}footer{text-align:center;color:#747b9c;font-size:12px;margin:45px 0 10px}a{color:#b6f76e;word-break:break-all}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#533347;color:white;border-radius:15px;padding:14px 22px;z-index:9;display:none}.confetti{position:fixed;pointer-events:none;top:-30px;animation:fall 2.7s linear forwards;font-size:25px}@keyframes fall{to{transform:translateY(110vh) rotate(500deg)}}@media(max-width:700px){main{padding:22px 16px}header{margin-bottom:30px}.grid{grid-template-columns:1fr;gap:25px}h1{letter-spacing:-2px}.options{grid-template-columns:1fr}.option{min-height:72px}.card{padding:22px}.pill{font-size:10px}.code{letter-spacing:6px}}
.invite-panel{display:grid;grid-template-columns:240px 1fr;gap:28px;align-items:center;text-align:left;max-width:740px;margin:24px auto;padding:22px;background:#111429;border:1px solid #ffffff18;border-radius:20px}.qr-image{display:block;width:240px;height:240px;max-width:100%;background:white;border-radius:12px}.invite-panel h3{margin:0 0 8px;font-size:22px}.invite-url{display:block;font-size:13px;line-height:1.6;margin:12px 0 18px;overflow-wrap:anywhere}.invite-actions{display:flex;gap:10px;flex-wrap:wrap}.invite-actions a{text-decoration:none;font-size:13px;display:inline-flex;align-items:center}.invite-actions button{font-size:13px}@media(max-width:600px){.invite-panel{grid-template-columns:1fr;text-align:center}.qr-image{margin:auto}.invite-actions{justify-content:center}}
</style>
<main><header><div class="brand">✳ BATALLA <b>LINFÁTICA</b></div><div class="header-tools"><button type="button" id="music-toggle" class="music-toggle" aria-pressed="false">🎵 Activar música</button><div class="pill">PATOLOGÍA · MULTIJUGADOR</div></div></header><div id="room-controls" class="room-controls" hidden></div><div id="app"></div><footer>30 preguntas basadas en «linfatico preguntas.pdf» · Aprende, compite y vuelve a intentarlo.</footer></main><div id="toast" role="alert"></div>
<script src="/fiesta.js"></script>
<script>
const app=document.querySelector('#app');let session=JSON.parse(sessionStorage.getItem('batalla')||'null'),state=null,tab='join',busy=false,renderKey='',lastPhase='',viewEpoch=0,polling=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,data={}){const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...session,...data})});const d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo conectar');return d}
function toast(s){const e=document.querySelector('#toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',4000)}
function home(){document.querySelector('#room-controls').hidden=true;app.innerHTML=`<div class="grid"><section><div class="eyebrow">Tu próximo reto empieza aquí</div><h1>Activa tu mente.<br><span>Defiende el podio.</span></h1><p>Una arena de patología para toda la clase. Responde, gana puntos y demuestra quién tiene los reflejos más rápidos.</p><div class="features"><span>⏱ 30 s por pregunta</span><span>🔥 Bonus por rachas</span><span>🏆 Podio en vivo</span></div></section><section class="card"><div class="orb">⚡</div><div class="tabs"><button data-tab="join" class="${tab==='join'?'active':''}">Unirme</button><button data-tab="create" class="${tab==='create'?'active':''}">Crear sala</button></div><h2>${tab==='join'?'Entra a la batalla':'Prepara la arena'}</h2><form id="entry">${tab==='join'?'<label for="code">Código de la sala</label><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="Ej. 482193" required><label for="name">Tu apodo</label><input id="name" maxlength="24" placeholder="Ej. Neutrófilo Ninja" required>':'<label for="count">Duración de la partida</label><select id="count"><option value="10">Sprint · 10 preguntas</option><option value="15" selected>Batalla · 15 preguntas</option><option value="30">Maratón · Las 30 preguntas</option></select><p class="small">Tú diriges las rondas. Tus compañeros juegan desde sus teléfonos, desde cualquier lugar y sin instalar nada.</p>'}<fieldset id="avatar-maker" class="avatar-maker"></fieldset><button class="primary">${tab==='join'?'¡Voy con todo! →':'Crear mi sala →'}</button><div class="error" id="error" role="alert"></div></form></section></div>`;Fiesta.mount(document.querySelector('#avatar-maker'));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;home()});document.querySelector('#entry').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('.primary');btn.disabled=true;try{session=await api(tab==='join'?'join':'create',tab==='join'?{code:document.querySelector('#code').value,name:document.querySelector('#name').value,avatar:Fiesta.chosen()}:{count:+document.querySelector('#count').value,avatar:Fiesta.chosen()});sessionStorage.setItem('batalla',JSON.stringify(session));renderKey='';await poll()}catch(err){document.querySelector('#error').textContent=err.message;btn.disabled=false}};const c=new URLSearchParams(location.search).get('sala');if(c&&document.querySelector('#code'))document.querySelector('#code').value=c}
function ranks(){return state.players.map((p,i)=>`<div class="rank"><span class="rank-person"><span>${['🥇','🥈','🥉'][i]||'#'+(i+1)}</span>${Fiesta.avatar(p.avatar,48)}<strong>${esc(p.name)}</strong></span><strong>${p.score.toLocaleString()} pts</strong></div>`).join('')}
function render(){let s=state;roomControls(s);remember(s);Fiesta.sync(s);const key=JSON.stringify({...s,now:0});if(key===renderKey)return;renderKey=key;
if(s.phase==='lobby'){app.innerHTML=`<div class="card center"><div class="eyebrow">La sala está abierta</div><h2>${s.host?'Reúne a tu equipo':'¡Estás dentro!'}</h2><p>Código de la batalla</p><div class="code">${s.code}</div>${s.host?`<section class="invite-panel" aria-label="Invitar a la sala"><img class="qr-image" src="/qr.svg?sala=${s.code}" alt="Código QR para entrar a la sala ${s.code}" width="240" height="240"><div><h3>Escanea. Entra. ¡Juega!</h3><p class="small">Apunta la cámara de tu teléfono al QR. También puedes abrir o compartir este enlace:</p><a class="invite-url" href="${esc(location.origin+'/?sala='+s.code)}" target="_blank" rel="noopener">${esc(location.origin+'/?sala='+s.code)}</a><div class="invite-actions"><button class="secondary" id="invite">🔗 Copiar enlace</button><button class="secondary" id="share">Compartir</button><a class="secondary" href="/qr.svg?sala=${s.code}" download="batalla-sala-${s.code}.svg">↓ Descargar QR</a></div></div></section>`:'<p>Invita a tus compañeros con el código o el enlace de la sala.</p>'}<div class="players">${s.players.map(p=>`<span class="player">${Fiesta.avatar(p.avatar,44)} ${esc(p.name)}</span>`).join('')||'<p>Esperando al primer valiente…</p>'}</div><p>${s.players.length} jugadores listos · ${s.total} preguntas</p>${s.host?`<button class="primary" id="next">${s.players.length?'¡Que empiece la batalla! →':'⚡ Probar yo solo →'}</button>${!s.players.length?'<p class="small">Puedes empezar sin invitados: tú responderás las preguntas y dirigirás las rondas.</p>':''}`:'<p>El anfitrión iniciará la partida. Prepárate.</p>'}<p class="small">Acierto: 500 puntos + hasta 500 por rapidez. Desde el segundo acierto seguido: +100, +200 y hasta +300 por racha. Fallar no resta puntos.</p></div>`}
else if(s.phase==='closed'){app.innerHTML='<div class="card center"><div class="eyebrow">Sala cerrada</div><h2>El anfitrión terminó esta sala</h2><p>Puedes volver al inicio para crear una nueva batalla o entrar a otra sala.</p><button class="primary" id="closed-home">Volver al inicio →</button></div>';document.querySelector('#closed-home').onclick=localHome}
else if(s.phase==='finished'){app.innerHTML=`<div class="center"><div class="eyebrow">Batalla completada</div><h1>El podio es <span>tuyo.</span></h1><div class="victory-avatar">${Fiesta.avatar(s.players[0]?.avatar,115)}</div><p>🏆 ${esc(s.players[0]?.name||'Equipo')}, ¡qué gran batalla!</p></div><div class="card">${ranks()}<p class="center">${s.mine?`🧠 ${s.mine.hits} / ${s.total} aciertos · 🔥 Mejor racha: ${s.mine.best}<br>Cada error de hoy es una oportunidad para aprender.`:"Cada error de hoy es una oportunidad para aprender."}</p>${s.mine?'<button class="primary" id="practice">🧠 Repasar mis preguntas difíciles</button><p class="small center">Sin reloj ni puntos: vuelve a intentarlo y descubre la explicación.</p>':''}<button class="secondary" id="exit">Volver al inicio →</button></div>`;if(lastPhase!=='finished')celebrate()}
else{const q=s.question,reveal=s.phase==='reveal',answered=s.players.filter(p=>p.answered).length;app.innerHTML=`<div class="status"><span class="tag">${esc(q.kind)}</span><span>RONDA ${s.index} / ${s.total}</span><div class="countdown"><span class="timer-label">¡Cada segundo cuenta!</span><div class="timer-ring" id="timer-ring"><strong id="timer">30</strong></div></div></div><div class="bar"><div id="timebar"></div></div><div class="card"><h2>${esc(q.text)}</h2><div class="options">${q.options.map((o,i)=>`<button class="option ${s.mine?.answer===i?'chosen':''} ${reveal&&i===q.correct?'correct':''} ${reveal&&s.mine?.answer===i&&i!==q.correct?'wrong':''}" data-answer="${i}" ${(s.host&&!s.mine)||reveal||s.mine?.answer!==null?'disabled':''}><i>${'ABCD'[i]}</i>${esc(o)}</button>`).join('')}</div>${reveal?`<div class="explain"><strong>${s.host&&!s.mine?'🧠 La clave de esta ronda':s.mine?.gain?'⚡ ¡Correcto! +'+s.mine.gain+' puntos':s.mine?.answer===null?'⏱ Se acabó el tiempo':'🧠 ¡Buena oportunidad para aprender!'}</strong><br>${esc(q.explanation)}${s.mine?.streak>1?`<p style="color:#b6f76e">🔥 ¡Racha de ${s.mine.streak}! Sigue así.</p>`:''}</div>`:`<p class="center">${s.mine?.answer!=null?'🔒 Respuesta enviada. ¡Cruza los dedos!':s.host&&!s.mine?'¡La arena está en marcha!':'Toca tu respuesta. La primera elección es definitiva.'} · ${answered}/${s.players.length} respuestas</p>`}${reveal?`<h3>Así va la batalla</h3>${ranks()}${s.host?`<button class="primary" id="next">${s.index===s.total?'Ver el podio 🏆':'Siguiente ronda →'}</button>`:'<p class="center">Esperando la siguiente ronda…</p>'}`:''}</div>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>act('answer',{answer:+b.dataset.answer,index:s.index}))}
document.querySelector('#practice')?.addEventListener('click',startPractice);document.querySelector('#share')?.addEventListener('click',async()=>{const url=location.origin+'/?sala='+s.code;if(navigator.share){try{await navigator.share({title:'Batalla linfática',text:'¡Únete a mi sala y vamos a aprender jugando!',url})}catch(e){if(e.name!=='AbortError')toast('Puedes usar Copiar enlace.')}}else document.querySelector('#invite').click()});document.querySelector('#invite')?.addEventListener('click',async()=>{const url=location.origin+'/?sala='+s.code;try{await navigator.clipboard.writeText(url);toast('¡Enlace copiado! Compártelo con tu clase.')}catch{toast('Tu invitación: '+url)}});document.querySelector('#next')?.addEventListener('click',()=>act('next'));document.querySelector('#exit')?.addEventListener('click',()=>{localHome()});lastPhase=s.phase;window.offset=s.now-Date.now()/1000;tick()}
async function act(a,d={}){if(busy)return;viewEpoch++;if(a==='answer')Fiesta.cue('tap');busy=true;try{state=await api(a,d);render()}catch(e){toast(e.message)}finally{busy=false}}
async function poll(){if(!session||busy||studying||polling)return;polling=true;const token=session.token,epoch=viewEpoch;try{const next=await api('state');if(!session||session.token!==token||epoch!==viewEpoch||studying)return;state=next;render()}catch(e){if(!session||session.token!==token||epoch!==viewEpoch)return;if(e.message.includes('encontramos')||e.message.includes('Sesión')||e.message.includes('Vuelve'))localHome();toast(e.message)}finally{polling=false}}
function tick(){if(!state)return;const left=state.phase==='question'?Math.max(0,Math.ceil(state.deadline-(Date.now()/1000+(window.offset||0)))):0;const t=document.querySelector('#timer');if(t)t.textContent=state.phase==='reveal'?'✓':left;if(state)Fiesta.tick(left,state);const b=document.querySelector('#timebar');if(b)b.style.width=(left/30*100)+'%'}
function celebrate(){for(let i=0;i<35;i++){const e=document.createElement('div');e.className='confetti';e.textContent=['✦','●','◆'][i%3];e.style.left=Math.random()*100+'vw';e.style.color=['#b6f76e','#ba9cff','#ff97ad'][i%3];e.style.animationDelay=Math.random()+'s';document.body.append(e);setTimeout(()=>e.remove(),4000)}}

let studying=false,studyList=[],studyIndex=0;
function remember(s){if(!session||s.phase!=='reveal'||!s.mine)return;const key='repaso:'+session.token+':'+state.run;let rows=JSON.parse(sessionStorage.getItem(key)||'[]');if(!rows.some(r=>r.index===s.index)){rows.push({index:s.index,...s.question,answer:s.mine.answer});sessionStorage.setItem(key,JSON.stringify(rows))}}
function startPractice(){const rows=JSON.parse(sessionStorage.getItem('repaso:'+session.token+':'+state.run)||'[]');studyList=rows.filter(r=>r.answer!==r.correct);if(!studyList.length){studyList=rows;toast('¡Excelente! Repasa tus aciertos para afianzarlos.')}if(!studyList.length)return;studying=true;Fiesta.study();studyIndex=0;practiceCard()}
function practiceCard(){const q=studyList[studyIndex];if(!q){app.innerHTML=`<div class="card center"><div class="orb" style="margin:0 auto">🧠</div><h1>Ahora sabes <span>más.</span></h1><p>Repasaste ${studyList.length} preguntas. ¡Ese es el verdadero premio!</p><button class="primary" id="backpodium">Volver al podio 🏆</button></div>`;document.querySelector('#backpodium').onclick=()=>{studying=false;renderKey='';render()};celebrate();return}app.innerHTML=`<div class="status"><span class="tag">MODO APRENDIZAJE</span><span>${studyIndex+1} / ${studyList.length} · Sin reloj</span></div><div class="card"><h2>${esc(q.text)}</h2><p>Piensa con calma. Aquí lo que importa es entender.</p><div class="options">${q.options.map((o,i)=>`<button class="option" data-study="${i}"><i>${'ABCD'[i]}</i>${esc(o)}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div></div>`;document.querySelectorAll('[data-study]').forEach(b=>b.onclick=()=>{const choice=+b.dataset.study;document.querySelectorAll('[data-study]').forEach((x,i)=>{x.disabled=true;if(i===q.correct)x.classList.add('correct');else if(i===choice)x.classList.add('wrong')});document.querySelector('#feedback').innerHTML=`<div class="explain"><strong>${choice===q.correct?'✨ ¡Lo tienes!':'🧠 Vamos a fijar esta idea'}</strong><br>Respuesta: ${esc(q.options[q.correct])}<br>${esc(q.explanation)}</div><p>${choice===q.correct?'Explícaselo a un compañero con tus propias palabras.':'Lee la explicación y piensa qué detalle distingue la respuesta correcta.'}</p><button class="primary" id="studyNext">${studyIndex+1===studyList.length?'Terminar mi repaso →':'Ya lo entendí. Siguiente →'}</button>`;document.querySelector('#studyNext').onclick=()=>{studyIndex++;practiceCard()}})}


function localHome(){viewEpoch++;session=null;state=null;studying=false;renderKey='';lastPhase='';sessionStorage.removeItem('batalla');Fiesta.sync({phase:'home',code:'',index:0});home()}
function roomControls(s){const el=document.querySelector('#room-controls');el.hidden=!session||s.phase==='closed';const key=s.code+':'+s.host+':'+(s.phase==='closed');if(el.dataset.key===key)return;el.dataset.key=key;el.innerHTML=`<span class="small">Sala ${s.code}</span><div>${s.host?'<button class="secondary" id="restart-room">↻ Empezar de nuevo</button>':''}<button class="secondary" id="leave-room">🚪 Salir de la sala</button></div>`;el.querySelector('#leave-room').onclick=()=>roomAction('leave');el.querySelector('#restart-room')?.addEventListener('click',()=>roomAction('restart'))}
function askRoom(title,message){return new Promise(resolve=>{const d=document.createElement('dialog');d.className='room-dialog';d.innerHTML=`<h2>${title}</h2><p>${message}</p><div class="dialog-actions"><button class="secondary" id="cancel-room">Seguir jugando</button><button class="primary" id="confirm-room">Sí, continuar</button></div>`;document.body.append(d);let done=false;const finish=v=>{if(done)return;done=true;d.close();d.remove();resolve(v)};d.querySelector('#cancel-room').onclick=()=>finish(false);d.querySelector('#confirm-room').onclick=()=>finish(true);d.addEventListener('cancel',e=>{e.preventDefault();finish(false)});d.showModal()})}
async function roomAction(action){if(busy||!session)return;const restart=action==='restart';const ok=await askRoom(restart?'¿Otra batalla desde cero?':'¿Quieres salir de la sala?',restart?'Se reiniciarán las preguntas, puntos y rachas para todos. Los jugadores y sus avatares seguirán en esta sala.':state.host?'Eres el anfitrión: se cerrará esta sala para todos. Después podrás crear otra o unirte a una diferente.':'Saldrás de esta partida y volverás al inicio. Tus compañeros podrán seguir jugando.');if(!ok)return;viewEpoch++;busy=true;try{const next=await api(action);studying=false;if(restart){state=next;renderKey='';lastPhase='';render();toast('¡Nueva batalla! Todos empiezan con cero puntos.')}else localHome()}catch(e){toast(e.message)}finally{busy=false}}

home();poll();setInterval(async()=>{await poll();if(state)window.offset=state.now-Date.now()/1000},1000);setInterval(tick,200);
</script></html>
